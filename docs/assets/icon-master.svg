<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    SessionPulse icon — AUTHORING MASTER. Single source of truth.

    Geometry only; no colour and no plate. Variants are composed by
    scripts/export-icons.mjs via inherited presentation attributes.
    See brand/ICON_PLAN.md sections 3, 5, 7, and 8.

    CONVENTIONS:
    1. Pure orthogonal vector geometry, stroke-linecap="square", stroke-linejoin="miter".
    2. Master stroke weight is 48; small-size cut is 118.
    3. Paint arrives through inherited presentation attributes: polyline leaves stroke
       unset (fill="none" explicit), circle leaves fill unset (stroke="none" explicit).
    4. Safe zone: all artwork within r <= 460 of (512,512).
    5. translate(0,51) balances the bottom miter/stroke (Y=728) and top apex dot
       (Y=194) so ink centres exactly on Y=512.
  -->
  <defs>
    <!-- FULL MARK: Stroke 48, Apex Dot r=54 at (512, 248) -->
    <g id="geo">
      <g transform="translate(0, 51)">
        <polyline points="192,512 336,512 336,608 440,608 440,248 584,248 584,704 688,704 688,512 832,512"
                  fill="none" stroke-width="48"
                  stroke-linecap="square" stroke-linejoin="miter" />
        <circle cx="512" cy="248" r="54" stroke="none" />
      </g>
    </g>

    <!-- SMALL-SIZE CUT (<=24px): Stroke 118, Dot dropped for clear aperture -->
    <g id="geo-small">
      <g transform="translate(0, 51)">
        <polyline points="192,512 336,512 336,608 440,608 440,248 584,248 584,704 688,704 688,512 832,512"
                  fill="none" stroke-width="118"
                  stroke-linecap="square" stroke-linejoin="miter" />
      </g>
    </g>
  </defs>

  <!-- Default preview on dark plate -->
  <rect width="1024" height="1024" fill="#12161A" />
  <g stroke="#B794F4" fill="#FFAC1C">
    <use href="#geo" />
  </g>
</svg>
