# Standards exceptions for Ninja6-MC/SessionPulse
#
# Schema and worked example: Ninja6-MC/.github standards/README.md section 3.
# An empty `exceptions` list is a statement that this repository conforms; the file is
# required either way (N6-REPO-05).

repo: SessionPulse

# This repository has no exceptions: it conforms to every rule in the register.
#
# The transitional N6-CI-05 entry that lived here is closed. It existed because `main`
# was protected without any required status checks: adopting the DCO and standards stubs
# is what makes those checks report under the names a required list has to name, and
# N6-CI-03 forbids requiring a name before it reports. It also had to outlast the merge
# that added the stubs, because open pull requests #1 and #2 predated them - #2 still
# reported the old unprefixed `Check Sign-off` and #1 reported no checks at all.
#
# All of that is now done. #1 was superseded and closed, #2 was rebased and merged, and
# `main` requires `dco / Check Sign-off` and `standards / Check Standards` with `strict`
# on. Both names were read off a real run before being required.
exceptions: []
