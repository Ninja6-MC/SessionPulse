name: Publish Release
run-name: Publish ${{ inputs.tag }} ${{ inputs.nonce }}

# Promotes a candidate built by release-candidate.yml. Start it on the release tag
# (scripts/release.sh does), never on a branch: every job requires github.ref to be
# that tag. RELEASE_PROCESS.md, step 3, describes the inputs and the retry rules.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, the same ref the workflow runs on (vX.Y.Z[-alpha.N|-beta.N|-rc.N])
        required: true
        type: string
      candidate_run_id:
        description: Run ID of the successful Release Candidate run for this tag
        required: true
        type: string
      destinations:
        description: Destinations to publish in this run, comma-separated
        required: true
        default: github,modrinth,hangar
        type: string
      modrinth_absence_confirmed:
        description: I inspected the Modrinth owner inventory for this exact version and it is absent in every state
        required: false
        default: false
        type: boolean
      hangar_absence_confirmed:
        description: I inspected the Hangar owner inventory for this exact version and it is absent in every state
        required: false
        default: false
        type: boolean
      nonce:
        description: Free text added to the run name so a script can find this run
        required: false
        default: ''
        type: string

# Evaluated when the run is queued, before any step can validate the inputs, so the
# group is keyed on the ref the run is on rather than on the tag input.
concurrency:
  group: release-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag }}
  CANDIDATE_RUN: ${{ inputs.candidate_run_id }}

jobs:
  plan:
    name: Plan Publication
    if: github.ref == format('refs/tags/{0}', inputs.tag)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No environment and no publishing secret: everything here fails before approval.
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      attempt: ${{ steps.candidate.outputs.attempt }}
      version: ${{ steps.vars.outputs.version }}
      channel: ${{ steps.vars.outputs.channel }}
      hangar_channel: ${{ steps.vars.outputs.hangar_channel }}
      prerelease: ${{ steps.vars.outputs.prerelease }}
      github: ${{ steps.vars.outputs.github }}
      modrinth: ${{ steps.vars.outputs.modrinth }}
      hangar: ${{ steps.vars.outputs.hangar }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate tag and destinations
        id: vars
        env:
          DESTINATIONS: ${{ inputs.destinations }}
          MODRINTH_CONFIRMED: ${{ inputs.modrinth_absence_confirmed }}
          HANGAR_CONFIRMED: ${{ inputs.hangar_absence_confirmed }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::Invalid release tag $TAG"
            exit 1
          fi
          test "$GITHUB_REF" = "refs/tags/$TAG"
          VERSION="${TAG#v}"
          case "$VERSION" in
            *-alpha.*) CHANNEL=alpha; HANGAR=Alpha; PRE=true ;;
            *-beta.*|*-rc.*) CHANNEL=beta; HANGAR=Beta; PRE=true ;;
            *) CHANNEL=release; HANGAR=Release; PRE=false ;;
          esac
          {
            echo "version=$VERSION"
            echo "channel=$CHANNEL"
            echo "hangar_channel=$HANGAR"
            echo "prerelease=$PRE"
          } >> "$GITHUB_OUTPUT"
          python3 scripts/release-publisher.py destinations --value "$DESTINATIONS"
          for pair in "modrinth:$MODRINTH_CONFIRMED" "hangar:$HANGAR_CONFIRMED"; do
            name="${pair%%:*}"
            if [ "${pair#*:}" = true ] && ! grep -qx "$name=true" "$GITHUB_OUTPUT"; then
              echo "::error::${name}_absence_confirmed is set but $name is not a selected destination"
              exit 1
            fi
          done
      - name: Verify candidate run provenance
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-publisher.py provenance --repo "$GITHUB_REPOSITORY" --tag "$TAG" --run-id "$CANDIDATE_RUN"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate-${{ inputs.candidate_run_id }}-${{ steps.candidate.outputs.attempt }}
          path: candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-evidence-${{ inputs.candidate_run_id }}-${{ steps.candidate.outputs.attempt }}
          path: .
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Verify candidate and test evidence
        env:
          SHA: ${{ steps.candidate.outputs.sha }}
          CANDIDATE_ATTEMPT: ${{ steps.candidate.outputs.attempt }}
        run: python3 scripts/release-candidate.py check-evidence --directory candidate --evidence evidence.json --tag "$TAG" --sha "$SHA" --run-id "$CANDIDATE_RUN" --attempt "$CANDIDATE_ATTEMPT"
      - name: Refuse attestations beside another publisher run
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTED: ${{ inputs.modrinth_absence_confirmed || inputs.hangar_absence_confirmed }}
        run: python3 scripts/release-publisher.py guard --repo "$GITHUB_REPOSITORY" --tag "$TAG" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --attested "$ATTESTED" --check-attempt
      - name: Require an attestation for each destination not publicly complete
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.candidate.outputs.sha }}
          CANDIDATE_ATTEMPT: ${{ steps.candidate.outputs.attempt }}
          SELECT_GITHUB: ${{ steps.vars.outputs.github }}
          SELECT_MODRINTH: ${{ steps.vars.outputs.modrinth }}
          SELECT_HANGAR: ${{ steps.vars.outputs.hangar }}
          MODRINTH_CONFIRMED: ${{ inputs.modrinth_absence_confirmed }}
          HANGAR_CONFIRMED: ${{ inputs.hangar_absence_confirmed }}
          MODRINTH_PROJECT: ${{ vars.MODRINTH_PROJECT || 'sessionpulse' }}
          HANGAR_PROJECT: ${{ vars.HANGAR_PROJECT || 'SessionPulse' }}
        run: |
          set -euo pipefail
          lookup() {
            python3 scripts/release-destination.py "$1" --directory candidate --evidence evidence.json --tag "$TAG" --sha "$SHA" --run-id "$CANDIDATE_RUN" --attempt "$CANDIDATE_ATTEMPT" "${@:2}"
          }
          confirmed() { if [ "$1" = true ]; then echo --absence-confirmed; fi; }
          if [ "$SELECT_GITHUB" = true ]; then lookup github; fi
          if [ "$SELECT_MODRINTH" = true ]; then
            lookup modrinth --project "$MODRINTH_PROJECT" --public-only --require-public-project $(confirmed "$MODRINTH_CONFIRMED")
          fi
          if [ "$SELECT_HANGAR" = true ]; then
            lookup hangar --project "$HANGAR_PROJECT" --public-only --require-hangar-target $(confirmed "$HANGAR_CONFIRMED")
          fi
      - name: Validate Gradle wrapper
        if: steps.vars.outputs.hangar == 'true'
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - if: steps.vars.outputs.hangar == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: temurin
      - if: steps.vars.outputs.hangar == 'true'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Validate Hangar task graph
        if: steps.vars.outputs.hangar == 'true'
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          CHANNEL: ${{ steps.vars.outputs.hangar_channel }}
          PROJECT: ${{ vars.HANGAR_PROJECT || 'SessionPulse' }}
        run: |
          chmod +x ./gradlew
          ./gradlew publishPluginPublicationToHangar --dry-run -PpluginVersion="$VERSION" -PhangarChannel="$CHANNEL" -PhangarProject="$PROJECT" -PreleaseJar="candidate/SessionPulse-$VERSION.jar" --no-daemon > task-graph.txt
          cat task-graph.txt
          python3 scripts/check-hangar-task-graph.py task-graph.txt
      - name: Show publication plan
        env:
          DESTINATIONS: ${{ inputs.destinations }}
          CANDIDATE_ATTEMPT: ${{ steps.candidate.outputs.attempt }}
        run: |
          {
            echo "## Publish $TAG"
            echo "Candidate run $CANDIDATE_RUN, attempt $CANDIDATE_ATTEMPT. Destinations: $DESTINATIONS."
            echo 'Approving the release environment releases every selected destination job at once.'
            echo '```json'
            cat candidate/manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish-github:
    name: Publish GitHub Release
    needs: [plan]
    if: github.ref == format('refs/tags/{0}', inputs.tag) && needs.plan.outputs.github == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      actions: read
    env:
      SHA: ${{ needs.plan.outputs.sha }}
      CANDIDATE_ATTEMPT: ${{ needs.plan.outputs.attempt }}
      VERSION: ${{ needs.plan.outputs.version }}
      HANGAR_CHANNEL: ${{ needs.plan.outputs.hangar_channel }}
      SELECT_GITHUB: ${{ needs.plan.outputs.github }}
      SELECT_MODRINTH: ${{ needs.plan.outputs.modrinth }}
      SELECT_HANGAR: ${{ needs.plan.outputs.hangar }}
      MODRINTH_PROJECT: ${{ vars.MODRINTH_PROJECT || 'sessionpulse' }}
      HANGAR_PROJECT: ${{ vars.HANGAR_PROJECT || 'SessionPulse' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate-${{ inputs.candidate_run_id }}-${{ needs.plan.outputs.attempt }}
          path: candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-evidence-${{ inputs.candidate_run_id }}-${{ needs.plan.outputs.attempt }}
          path: .
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Validate Gradle wrapper
        if: needs.plan.outputs.hangar == 'true'
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - if: needs.plan.outputs.hangar == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: temurin
      - if: needs.plan.outputs.hangar == 'true'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Preflight every selected destination
        env:
          GH_TOKEN: ${{ github.token }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
          MIGRATED: ${{ vars.RELEASE_SECRETS_MIGRATED }}
        run: bash scripts/release-preflight.sh
      - name: Check GitHub destination
        id: github
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-destination.py github --directory candidate --evidence evidence.json --tag "$TAG" --sha "$SHA" --run-id "$CANDIDATE_RUN" --attempt "$CANDIDATE_ATTEMPT"
      - name: Publish GitHub release if absent
        if: steps.github.outputs.state == 'absent'
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(--title "SessionPulse $TAG" --notes-file candidate/release-body.md)
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease --latest=false); else args+=(--latest); fi
          gh release create "$TAG" "candidate/SessionPulse-$VERSION.jar" "candidate/SessionPulse-$VERSION.jar.sha256" --verify-tag "${args[@]}"
      - name: Verify GitHub consumer downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-destination.py github --directory candidate --evidence evidence.json --tag "$TAG" --sha "$SHA" --run-id "$CANDIDATE_RUN" --attempt "$CANDIDATE_ATTEMPT" --require-complete

  publish-modrinth:
    name: Publish Modrinth Version
    needs: [plan]
    if: github.ref == format('refs/tags/{0}', inputs.tag) && needs.plan.outputs.modrinth == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      actions: read
    env:
      SHA: ${{ needs.plan.outputs.sha }}
      CANDIDATE_ATTEMPT: ${{ needs.plan.outputs.attempt }}
      VERSION: ${{ needs.plan.outputs.version }}
      HANGAR_CHANNEL: ${{ needs.plan.outputs.hangar_channel }}
      SELECT_GITHUB: ${{ needs.plan.outputs.github }}
      SELECT_MODRINTH: ${{ needs.plan.outputs.modrinth }}
      SELECT_HANGAR: ${{ needs.plan.outputs.hangar }}
      MODRINTH_PROJECT: ${{ vars.MODRINTH_PROJECT || 'sessionpulse' }}
      HANGAR_PROJECT: ${{ vars.HANGAR_PROJECT || 'SessionPulse' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate-${{ inputs.candidate_run_id }}-${{ needs.plan.outputs.attempt }}
          path: candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-evidence-${{ inputs.candidate_run_id }}-${{ needs.plan.outputs.attempt }}
          path: .
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Validate Gradle wrapper
        if: needs.plan.outputs.hangar == 'true'
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - if: needs.plan.outputs.hangar == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: temurin
      - if: needs.plan.outputs.hangar == 'true'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Preflight every selected destination
        env:
          GH_TOKEN: ${{ github.token }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
          MIGRATED: ${{ vars.RELEASE_SECRETS_MIGRATED }}
        run: bash scripts/release-preflight.sh
      - name: Check Modrinth destination
        id: modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CONFIRMED: ${{ inputs.modrinth_absence_confirmed }}
        run: |
          set -euo pipefail
          args=()
          if [ "$CONFIRMED" = true ]; then args+=(--absence-confirmed); fi
          python3 scripts/release-destination.py modrinth --project "$MODRINTH_PROJECT" --directory candidate --evidence evidence.json --tag "$TAG" --sha "$SHA" --run-id "$CANDIDATE_RUN" --attempt "$CANDIDATE_ATTEMPT" --require-public-project "${args[@]}"
      # Re-running this job alone reuses plan's outputs, so the attempt is checked here.
      - name: Refuse a reused Modrinth attestation
        if: steps.modrinth.outputs.state == 'absent'
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTED: ${{ inputs.modrinth_absence_confirmed }}
        run: python3 scripts/release-publisher.py guard --repo "$GITHUB_REPOSITORY" --tag "$TAG" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --attested "$ATTESTED" --check-attempt
      - name: Publish Modrinth if absent
        if: steps.modrinth.outputs.state == 'absent'
        uses: Kira-NT/mc-publish@c23376546a97f5ba7984e94445da359459b14419 # v3.3.2
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT || 'sessionpulse' }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: false
          modrinth-unfeature-mode: none
          name: SessionPulse ${{ needs.plan.outputs.version }}
          version: ${{ needs.plan.outputs.version }}
          version-type: ${{ needs.plan.outputs.channel }}
          changelog-file: candidate/release-notes.md
          files: candidate/SessionPulse-${{ needs.plan.outputs.version }}.jar
          dependencies: |
            essentialsx(optional){modrinth:hXiIvTyT}
          # Modrinth combines flat loader/version filters. Folia has no 26.3
          # build; keep this version's advertised combinations conservative.
          loaders: |
            paper
            spigot
          game-versions: |
            1.20.4
            1.20.5
            1.20.6
            1.21
            1.21.1
            1.21.2
            1.21.3
            1.21.4
            1.21.5
            1.21.6
            1.21.7
            1.21.8
            1.21.9
            1.21.10
            1.21.11
            26.3
          java: 21
      - name: Verify Modrinth consumer download
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          VISIBILITY_RETRIES: ${{ steps.modrinth.outputs.state == 'absent' && '6' || '0' }}
        run: python3 scripts/release-destination.py modrinth --project "$MODRINTH_PROJECT" --directory candidate --evidence evidence.json --tag "$TAG" --sha "$SHA" --run-id "$CANDIDATE_RUN" --attempt "$CANDIDATE_ATTEMPT" --require-complete --modrinth-visibility-retries "$VISIBILITY_RETRIES"

  publish-hangar:
    name: Publish Hangar Version
    needs: [plan]
    if: github.ref == format('refs/tags/{0}', inputs.tag) && needs.plan.outputs.hangar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      actions: read
    env:
      SHA: ${{ needs.plan.outputs.sha }}
      CANDIDATE_ATTEMPT: ${{ needs.plan.outputs.attempt }}
      VERSION: ${{ needs.plan.outputs.version }}
      HANGAR_CHANNEL: ${{ needs.plan.outputs.hangar_channel }}
      SELECT_GITHUB: ${{ needs.plan.outputs.github }}
      SELECT_MODRINTH: ${{ needs.plan.outputs.modrinth }}
      SELECT_HANGAR: ${{ needs.plan.outputs.hangar }}
      MODRINTH_PROJECT: ${{ vars.MODRINTH_PROJECT || 'sessionpulse' }}
      HANGAR_PROJECT: ${{ vars.HANGAR_PROJECT || 'SessionPulse' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate-${{ inputs.candidate_run_id }}-${{ needs.plan.outputs.attempt }}
          path: candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-evidence-${{ inputs.candidate_run_id }}-${{ needs.plan.outputs.attempt }}
          path: .
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Preflight every selected destination
        env:
          GH_TOKEN: ${{ github.token }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
          MIGRATED: ${{ vars.RELEASE_SECRETS_MIGRATED }}
        run: bash scripts/release-preflight.sh
      - name: Check Hangar destination
        id: hangar
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
          CONFIRMED: ${{ inputs.hangar_absence_confirmed }}
        run: |
          set -euo pipefail
          args=()
          if [ "$CONFIRMED" = true ]; then args+=(--absence-confirmed); fi
          python3 scripts/release-destination.py hangar --project "$HANGAR_PROJECT" --directory candidate --evidence evidence.json --tag "$TAG" --sha "$SHA" --run-id "$CANDIDATE_RUN" --attempt "$CANDIDATE_ATTEMPT" "${args[@]}"
      # Re-running this job alone reuses plan's outputs, so the attempt is checked here.
      - name: Refuse a reused Hangar attestation
        if: steps.hangar.outputs.state == 'absent'
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTED: ${{ inputs.hangar_absence_confirmed }}
        run: python3 scripts/release-publisher.py guard --repo "$GITHUB_REPOSITORY" --tag "$TAG" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --attested "$ATTESTED" --check-attempt
      - name: Publish Hangar if absent
        if: steps.hangar.outputs.state == 'absent'
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
          CONFIRMED: ${{ inputs.hangar_absence_confirmed }}
        run: |
          set -euo pipefail
          args=()
          if [ "$CONFIRMED" = true ]; then args+=(--absence-confirmed); fi
          python3 scripts/release-destination.py hangar --project "$HANGAR_PROJECT" --directory candidate --evidence evidence.json --tag "$TAG" --sha "$SHA" --run-id "$CANDIDATE_RUN" --attempt "$CANDIDATE_ATTEMPT" "${args[@]}" --require-absent
          mkdir -p build
          cp candidate/release-notes.md build/release-notes.md
          BEFORE="$(sha256sum "candidate/SessionPulse-$VERSION.jar")"
          ./gradlew publishPluginPublicationToHangar -PpluginVersion="$VERSION" -PhangarChannel="$HANGAR_CHANNEL" -PhangarProject="$HANGAR_PROJECT" -PreleaseJar="candidate/SessionPulse-$VERSION.jar" --no-daemon
          test "$BEFORE" = "$(sha256sum "candidate/SessionPulse-$VERSION.jar")"
      - name: Verify Hangar receipt before page sync
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
        run: python3 scripts/release-destination.py hangar --project "$HANGAR_PROJECT" --directory candidate --evidence evidence.json --tag "$TAG" --sha "$SHA" --run-id "$CANDIDATE_RUN" --attempt "$CANDIDATE_ATTEMPT" --require-complete
      # The project page is shared state: an older version must not overwrite a newer one's page.
      - name: Check this is the newest public version on its channel
        id: page
        run: python3 scripts/release-publisher.py hangar-sync --project "$HANGAR_PROJECT" --version "$VERSION" --channel "$HANGAR_CHANNEL"
      - name: Sync Hangar resource page
        if: steps.page.outputs.sync == 'true'
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
        run: ./gradlew syncPluginPublicationMainResourcePagePageToHangar -PhangarProject="$HANGAR_PROJECT" --no-daemon
