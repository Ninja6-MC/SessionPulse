name: Publish Release

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  candidate:
    name: Build Release Candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      attempt: ${{ steps.vars.outputs.attempt }}
      sha: ${{ steps.vars.outputs.sha }}
      version: ${{ steps.vars.outputs.version }}
      channel: ${{ steps.vars.outputs.channel }}
      hangar_channel: ${{ steps.vars.outputs.hangar_channel }}
      prerelease: ${{ steps.vars.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate tag and source
        id: vars
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::Invalid release tag $TAG"
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          SHA="$(git rev-parse HEAD)"
          test "$SHA" = "$(git rev-parse "$TAG^{commit}")"
          git merge-base --is-ancestor "$SHA" origin/main
          VERSION="${TAG#v}"
          case "$VERSION" in
            *-alpha.*) CHANNEL=alpha; HANGAR=Alpha; PRE=true ;;
            *-beta.*|*-rc.*) CHANNEL=beta; HANGAR=Beta; PRE=true ;;
            *) CHANNEL=release; HANGAR=Release; PRE=false ;;
          esac
          {
            echo "sha=$SHA"
            echo "attempt=$GITHUB_RUN_ATTEMPT"
            echo "version=$VERSION"
            echo "channel=$CHANNEL"
            echo "hangar_channel=$HANGAR"
            echo "prerelease=$PRE"
          } >> "$GITHUB_OUTPUT"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Collect release notes
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          PRERELEASE: ${{ steps.vars.outputs.prerelease }}
        run: |
          set -euo pipefail
          extract() {
            awk -v header="## [$1]" '
              index($0, header) == 1 { found = 1; next }
              found && /^## / { exit }
              found && /^\[[^]]+\]: / { exit }
              found { print }
            ' CHANGELOG.md
          }
          blank() { [ -z "${1//[[:space:]]/}" ]; }
          NOTES="$(extract "$VERSION")"
          if [ "$PRERELEASE" = true ]; then
            blank "$NOTES" && NOTES="$(extract "${VERSION%%-*}")"
            blank "$NOTES" && NOTES="$(extract Unreleased)"
            blank "$NOTES" && NOTES="No changelog section was written for this pre-release."
          elif blank "$NOTES"; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          mkdir -p candidate
          printf '%s\n' "$NOTES" > candidate/release-notes.md
          printf '%s\n\nRequires Java 21.\n' "$NOTES" > candidate/release-body.md
      - name: Test source and build candidate once
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          chmod +x ./gradlew
          ./gradlew test shadowJar -PpluginVersion="$VERSION" --no-daemon
          shopt -s nullglob
          jars=(build/libs/*.jar)
          test -f "build/libs/SessionPulse-$VERSION.jar"
          cp "build/libs/SessionPulse-$VERSION.jar" candidate/
          (cd candidate && sha256sum "SessionPulse-$VERSION.jar" > "SessionPulse-$VERSION.jar.sha256")
      - name: Seal candidate manifest
        env:
          SHA: ${{ steps.vars.outputs.sha }}
        run: |
          python3 scripts/release-candidate.py create --directory candidate --tag "$GITHUB_REF_NAME" --sha "$SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Retain candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate/
          if-no-files-found: error
          retention-days: 30

  smoke:
    name: Candidate Smoke (${{ matrix.label }})
    needs: candidate
    env:
      CANDIDATE_ATTEMPT: ${{ needs.candidate.outputs.attempt }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.platform == 'spigot' && 60 || 35 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: paper, platform: paper, minecraft: '1.21.11', java: '21', fixture: botClientJar, bot: SessionPulseProbeBot}
          - {label: folia, platform: folia, minecraft: '1.21.11', java: '21', fixture: botClientJar, bot: SessionPulseProbeBot}
          - {label: spigot, platform: spigot, minecraft: '1.21.11', java: '21', fixture: botClientJar, bot: SessionPulseProbeBot}
          - {label: 'paper 26.3', platform: paper, minecraft: '26.3', java: '25', fixture: botClient26Jar, bot: SessionPulseProbeBot26, server_build: '147'}
          - {label: 'spigot 26.3', platform: spigot, minecraft: '26.3', java: '25', fixture: botClient26Jar, bot: SessionPulseProbeBot26}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ github.run_id }}-${{ needs.candidate.outputs.attempt }}
          path: candidate
      - name: Verify downloaded candidate before tests
        env:
          SHA: ${{ needs.candidate.outputs.sha }}
        run: python3 scripts/release-candidate.py verify --directory candidate --tag "$GITHUB_REF_NAME" --sha "$SHA" --run-id "$GITHUB_RUN_ID" --attempt "$CANDIDATE_ATTEMPT"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build protocol test fixture
        run: |
          chmod +x ./gradlew
          ./gradlew ${{ matrix.fixture }} --no-daemon
      - name: Set up server runtime
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
      - name: Build Spigot test server
        id: spigot-input
        if: matrix.platform == 'spigot'
        env:
          MC_VERSION: ${{ matrix.minecraft }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/buildtools" "$RUNNER_TEMP/spigot-jar" "$RUNNER_TEMP/spigot-input"
          REVISION="$(python3 scripts/spigot-input.py --minecraft "$MC_VERSION" --field revision)"
          BUILD="$(python3 scripts/spigot-input.py --minecraft "$MC_VERSION" --field buildtools_build)"
          curl -fsSL --retry 3 --retry-delay 5 -m 60 -o "$RUNNER_TEMP/spigot-input/metadata.json" "https://hub.spigotmc.org/versions/$REVISION.json"
          curl -fsSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/buildtools/BuildTools.jar" "https://hub.spigotmc.org/jenkins/job/BuildTools/$BUILD/artifact/target/BuildTools.jar"
          python3 scripts/spigot-input.py --minecraft "$MC_VERSION" --metadata "$RUNNER_TEMP/spigot-input/metadata.json" --buildtools "$RUNNER_TEMP/buildtools/BuildTools.jar" --output "$RUNNER_TEMP/spigot-input/input.json" --github-output "$GITHUB_OUTPUT"
          cd "$RUNNER_TEMP/buildtools"
          java -jar BuildTools.jar --rev "$REVISION" --compile SPIGOT --output-dir "$RUNNER_TEMP/spigot-jar" --final-name "spigot-$MC_VERSION.jar"
      - name: Exercise downloaded JAR
        env:
          VERSION: ${{ needs.candidate.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          SPIGOT_JAR: ${{ runner.temp }}/spigot-jar/spigot-${{ matrix.minecraft }}.jar
          BOT_JAR: build/test-fixtures/${{ matrix.bot }}.jar
          SERVER_BUILD: ${{ matrix.server_build }}
          BUILDTOOLS_BUILD: ${{ steps.spigot-input.outputs.buildtools_build }}
          SPIGOT_INPUT: ${{ matrix.platform == 'spigot' && format('{0}/spigot-input/input.json', runner.temp) || '' }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/smoke-test.sh
          .github/scripts/smoke-test.sh "$PLATFORM" "${{ matrix.minecraft }}" "candidate/SessionPulse-$VERSION.jar"
      - name: Record passing smoke evidence
        env:
          SHA: ${{ needs.candidate.outputs.sha }}
          PLATFORM: ${{ matrix.platform }}
        run: python3 scripts/release-candidate.py receipt --directory candidate --tag "$GITHUB_REF_NAME" --sha "$SHA" --run-id "$GITHUB_RUN_ID" --attempt "$CANDIDATE_ATTEMPT" --platform "$PLATFORM" --smoke-evidence "run-$PLATFORM/evidence.json" --output "smoke-$PLATFORM-${{ matrix.minecraft }}.json"
      - name: Retain smoke receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-${{ matrix.platform }}-${{ matrix.minecraft }}-${{ github.run_id }}-${{ needs.candidate.outputs.attempt }}
          path: smoke-${{ matrix.platform }}-${{ matrix.minecraft }}.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain smoke logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-log-${{ matrix.platform }}-${{ matrix.minecraft }}-${{ github.run_id }}-${{ needs.candidate.outputs.attempt }}
          path: |
            run-${{ matrix.platform }}/server.log
            run-${{ matrix.platform }}/bot-*.log
            run-${{ matrix.platform }}/evidence.json
            run-${{ matrix.platform }}/spigot-input.json
          if-no-files-found: warn
          retention-days: 30

  evidence:
    name: Verify Candidate Evidence
    needs: [candidate, smoke]
    env:
      CANDIDATE_ATTEMPT: ${{ needs.candidate.outputs.attempt }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ github.run_id }}-${{ needs.candidate.outputs.attempt }}
          path: candidate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: smoke-*-${{ github.run_id }}-${{ needs.candidate.outputs.attempt }}
          path: receipts
          merge-multiple: true
      - name: Bind passing test evidence
        env:
          SHA: ${{ needs.candidate.outputs.sha }}
        run: python3 scripts/release-candidate.py evidence --directory candidate --receipts receipts --tag "$GITHUB_REF_NAME" --sha "$SHA" --run-id "$GITHUB_RUN_ID" --attempt "$CANDIDATE_ATTEMPT" --output evidence.json
      - name: Show candidate for approval and registry reconciliation
        env:
          SHA: ${{ needs.candidate.outputs.sha }}
          MODRINTH_PROJECT: ${{ vars.MODRINTH_PROJECT || 'sessionpulse' }}
          HANGAR_PROJECT: ${{ vars.HANGAR_PROJECT || 'SessionPulse' }}
        run: |
          {
            echo '## Verified release candidate'
            echo 'Inspect each registry owner inventory, including drafts, unlisted, scheduled and deleted versions. Record only confirmed absent destinations in the release environment RELEASE_ABSENCE_RECONCILIATION variable before approving publication. An omitted API result is not proof of absence.'
            echo 'Modrinth: sign in as the project owner and inspect the project Versions management list. Check every available status, including draft, unlisted, scheduled and archived versions, plus any deleted-version view. Confirm this exact version is absent.'
            echo 'Hangar: sign in as the project owner and inspect the project Versions and management views. Check hidden and soft-deleted versions, plus any deleted-version view. Confirm this exact version is absent.'
            echo 'If a status or history view is unavailable, resolve that uncertainty before confirming the destination absent; do not infer absence from the public page alone.'
            echo '```json'
            cat candidate/manifest.json
            echo '```'
            echo '### RELEASE_ABSENCE_RECONCILIATION value'
            echo 'Copy this record after confirming both destination versions are absent. If a project slug is overridden in the release environment, replace that project value before saving it.'
            echo '```json'
            python3 scripts/release-candidate.py reconciliation --directory candidate --tag "$GITHUB_REF_NAME" --sha "$SHA" --run-id "$GITHUB_RUN_ID" --attempt "$CANDIDATE_ATTEMPT" --modrinth-project "$MODRINTH_PROJECT" --hangar-project "$HANGAR_PROJECT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ github.run_id }}-${{ needs.candidate.outputs.attempt }}
          path: evidence.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Approve and Promote Candidate
    needs: [candidate, evidence]
    env:
      CANDIDATE_ATTEMPT: ${{ needs.candidate.outputs.attempt }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    # Set only after a maintainer checks the owning registry inventories for this
    # candidate. Public APIs cannot prove that an omitted version does not exist.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ github.run_id }}-${{ needs.candidate.outputs.attempt }}
          path: candidate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-evidence-${{ github.run_id }}-${{ needs.candidate.outputs.attempt }}
          path: .
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Require environment publishing tokens
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
          MIGRATED: ${{ vars.RELEASE_SECRETS_MIGRATED }}
        run: |
          test "$MIGRATED" = true || { echo '::error::Release token migration is incomplete; see #79'; exit 1; }
          test -n "$MODRINTH_TOKEN" || { echo '::error::Missing release environment MODRINTH_TOKEN'; exit 1; }
          test -n "$HANGAR_API_TOKEN" || { echo '::error::Missing release environment HANGAR_API_TOKEN'; exit 1; }
      - name: Preflight Modrinth before publication
        env:
          RELEASE_ABSENCE_RECONCILIATION: ${{ vars.RELEASE_ABSENCE_RECONCILIATION }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          SHA: ${{ needs.candidate.outputs.sha }}
          PROJECT: ${{ vars.MODRINTH_PROJECT || 'sessionpulse' }}
        run: python3 scripts/release-destination.py modrinth --project "$PROJECT" --directory candidate --evidence evidence.json --tag "$GITHUB_REF_NAME" --sha "$SHA" --run-id "$GITHUB_RUN_ID" --attempt "$CANDIDATE_ATTEMPT" --require-public-project --require-modrinth-upload-access
      - name: Preflight Hangar before publication
        id: hangar_preflight
        env:
          RELEASE_ABSENCE_RECONCILIATION: ${{ vars.RELEASE_ABSENCE_RECONCILIATION }}
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
          SHA: ${{ needs.candidate.outputs.sha }}
          PROJECT: ${{ vars.HANGAR_PROJECT || 'SessionPulse' }}
        run: python3 scripts/release-destination.py hangar --project "$PROJECT" --directory candidate --evidence evidence.json --tag "$GITHUB_REF_NAME" --sha "$SHA" --run-id "$GITHUB_RUN_ID" --attempt "$CANDIDATE_ATTEMPT" --require-hangar-target --require-hangar-upload-access
      - name: Validate Hangar task graph before publication
        if: steps.hangar_preflight.outputs.state == 'absent'
        env:
          VERSION: ${{ needs.candidate.outputs.version }}
          CHANNEL: ${{ needs.candidate.outputs.hangar_channel }}
          PROJECT: ${{ vars.HANGAR_PROJECT || 'SessionPulse' }}
        run: |
          chmod +x ./gradlew
          ./gradlew publishPluginPublicationToHangar --dry-run -PpluginVersion="$VERSION" -PhangarChannel="$CHANNEL" -PhangarProject="$PROJECT" -PreleaseJar="candidate/SessionPulse-$VERSION.jar" --no-daemon > task-graph.txt
          cat task-graph.txt
          python3 scripts/check-hangar-task-graph.py task-graph.txt
      - name: Check GitHub destination
        id: github
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.candidate.outputs.sha }}
        run: python3 scripts/release-destination.py github --directory candidate --evidence evidence.json --tag "$GITHUB_REF_NAME" --sha "$SHA" --run-id "$GITHUB_RUN_ID" --attempt "$CANDIDATE_ATTEMPT"
      - name: Publish GitHub release if absent
        if: steps.github.outputs.state == 'absent'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.candidate.outputs.version }}
          PRERELEASE: ${{ needs.candidate.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(--title "SessionPulse $GITHUB_REF_NAME" --notes-file candidate/release-body.md)
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease --latest=false); else args+=(--latest); fi
          gh release create "$GITHUB_REF_NAME" "candidate/SessionPulse-$VERSION.jar" "candidate/SessionPulse-$VERSION.jar.sha256" --verify-tag "${args[@]}"
      - name: Verify GitHub consumer downloads
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.candidate.outputs.sha }}
        run: python3 scripts/release-destination.py github --directory candidate --evidence evidence.json --tag "$GITHUB_REF_NAME" --sha "$SHA" --run-id "$GITHUB_RUN_ID" --attempt "$CANDIDATE_ATTEMPT" --require-complete
      - name: Check Modrinth destination
        id: modrinth
        env:
          RELEASE_ABSENCE_RECONCILIATION: ${{ vars.RELEASE_ABSENCE_RECONCILIATION }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          SHA: ${{ needs.candidate.outputs.sha }}
          PROJECT: ${{ vars.MODRINTH_PROJECT || 'sessionpulse' }}
        run: python3 scripts/release-destination.py modrinth --project "$PROJECT" --directory candidate --evidence evidence.json --tag "$GITHUB_REF_NAME" --sha "$SHA" --run-id "$GITHUB_RUN_ID" --attempt "$CANDIDATE_ATTEMPT"
      - name: Publish Modrinth if absent
        if: steps.modrinth.outputs.state == 'absent'
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT || 'sessionpulse' }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: false
          modrinth-unfeature-mode: none
          name: SessionPulse ${{ needs.candidate.outputs.version }}
          version: ${{ needs.candidate.outputs.version }}
          version-type: ${{ needs.candidate.outputs.channel }}
          changelog-file: candidate/release-notes.md
          files: candidate/SessionPulse-${{ needs.candidate.outputs.version }}.jar
          dependencies: |
            essentialsx(optional){modrinth:hXiIvTyT}
          loaders: |
            paper
            spigot
            purpur
            folia
          game-versions: |
            1.20.4
            1.20.5
            1.20.6
            1.21
            1.21.1
            1.21.2
            1.21.3
            1.21.4
            1.21.5
            1.21.6
            1.21.7
            1.21.8
            1.21.9
            1.21.10
            1.21.11
          java: 21
      - name: Verify Modrinth consumer download
        env:
          RELEASE_ABSENCE_RECONCILIATION: ${{ vars.RELEASE_ABSENCE_RECONCILIATION }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          SHA: ${{ needs.candidate.outputs.sha }}
          PROJECT: ${{ vars.MODRINTH_PROJECT || 'sessionpulse' }}
        run: python3 scripts/release-destination.py modrinth --project "$PROJECT" --directory candidate --evidence evidence.json --tag "$GITHUB_REF_NAME" --sha "$SHA" --run-id "$GITHUB_RUN_ID" --attempt "$CANDIDATE_ATTEMPT" --require-complete
      - name: Check Hangar destination
        id: hangar
        env:
          RELEASE_ABSENCE_RECONCILIATION: ${{ vars.RELEASE_ABSENCE_RECONCILIATION }}
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
          SHA: ${{ needs.candidate.outputs.sha }}
          PROJECT: ${{ vars.HANGAR_PROJECT || 'SessionPulse' }}
        run: python3 scripts/release-destination.py hangar --project "$PROJECT" --directory candidate --evidence evidence.json --tag "$GITHUB_REF_NAME" --sha "$SHA" --run-id "$GITHUB_RUN_ID" --attempt "$CANDIDATE_ATTEMPT"
      - name: Publish Hangar if absent
        if: steps.hangar.outputs.state == 'absent'
        env:
          RELEASE_ABSENCE_RECONCILIATION: ${{ vars.RELEASE_ABSENCE_RECONCILIATION }}
          SHA: ${{ needs.candidate.outputs.sha }}
          VERSION: ${{ needs.candidate.outputs.version }}
          CHANNEL: ${{ needs.candidate.outputs.hangar_channel }}
          PROJECT: ${{ vars.HANGAR_PROJECT || 'SessionPulse' }}
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/release-destination.py hangar --project "$PROJECT" --directory candidate --evidence evidence.json --tag "$GITHUB_REF_NAME" --sha "$SHA" --run-id "$GITHUB_RUN_ID" --attempt "$CANDIDATE_ATTEMPT" --require-absent
          mkdir -p build
          cp candidate/release-notes.md build/release-notes.md
          BEFORE="$(sha256sum "candidate/SessionPulse-$VERSION.jar")"
          ./gradlew publishPluginPublicationToHangar -PpluginVersion="$VERSION" -PhangarChannel="$CHANNEL" -PhangarProject="$PROJECT" -PreleaseJar="candidate/SessionPulse-$VERSION.jar" --no-daemon
          test "$BEFORE" = "$(sha256sum "candidate/SessionPulse-$VERSION.jar")"
      - name: Verify Hangar receipt before page sync
        env:
          RELEASE_ABSENCE_RECONCILIATION: ${{ vars.RELEASE_ABSENCE_RECONCILIATION }}
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
          SHA: ${{ needs.candidate.outputs.sha }}
          PROJECT: ${{ vars.HANGAR_PROJECT || 'SessionPulse' }}
        run: |
          python3 scripts/release-destination.py hangar --project "$PROJECT" --directory candidate --evidence evidence.json --tag "$GITHUB_REF_NAME" --sha "$SHA" --run-id "$GITHUB_RUN_ID" --attempt "$CANDIDATE_ATTEMPT" --require-complete
      - name: Sync Hangar resource page
        env:
          PROJECT: ${{ vars.HANGAR_PROJECT || 'SessionPulse' }}
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
        run: |
          ./gradlew syncPluginPublicationMainResourcePagePageToHangar -PhangarProject="$PROJECT" --no-daemon
