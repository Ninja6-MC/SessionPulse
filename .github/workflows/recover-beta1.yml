name: Complete Published Beta.1

on:
  workflow_dispatch:

concurrency:
  group: release-refs/tags/v0.2.0-beta.1
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  RELEASE_TAG: v0.2.0-beta.1
  SOURCE_SHA: 311f732e427ecd54f4190518a696aaac59590eb6
  CANDIDATE_RUN_ID: '38048881901'
  CANDIDATE_ATTEMPT: '1'

jobs:
  prepare:
    name: Verify published candidate provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: '11668199275'
          path: candidate
          run-id: 38048881901
          github-token: ${{ github.token }}
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: '11668299901'
          path: .
          run-id: 38048881901
          github-token: ${{ github.token }}
          merge-multiple: true
      - name: Verify fixed run, unchanged tags, retained JAR and gameplay evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/recover-beta1.py

  complete:
    name: Approve and complete published beta.1
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: '11668199275'
          path: candidate
          run-id: 38048881901
          github-token: ${{ github.token }}
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: '11668299901'
          path: .
          run-id: 38048881901
          github-token: ${{ github.token }}
          merge-multiple: true
      - name: Revalidate provenance after approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/recover-beta1.py
      - name: Verify all existing release destinations before page-only sync
        env:
          GH_TOKEN: ${{ github.token }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
          MIGRATED: ${{ vars.RELEASE_SECRETS_MIGRATED }}
        run: |
          set -euo pipefail
          test "$MIGRATED" = true
          test -n "$MODRINTH_TOKEN"
          test -n "$HANGAR_API_TOKEN"
          for destination in github modrinth hangar; do
            project=()
            if [ "$destination" = modrinth ]; then project=(--project sessionpulse); fi
            if [ "$destination" = hangar ]; then project=(--project SessionPulse --require-hangar-target --require-hangar-upload-access); fi
            python3 scripts/release-destination.py "$destination" "${project[@]}" --directory candidate --evidence evidence.json --tag "$RELEASE_TAG" --sha "$SOURCE_SHA" --run-id "$CANDIDATE_RUN_ID" --attempt "$CANDIDATE_ATTEMPT" --require-complete
          done
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Sync and verify Hangar resource page
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
        run: |
          chmod +x ./gradlew
          ./gradlew syncPluginPublicationMainResourcePagePageToHangar -PhangarProject=SessionPulse --no-daemon
