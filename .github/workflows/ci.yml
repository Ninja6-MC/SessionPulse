name: Continuous Integration

on:
  # Topic branches are covered by the pull_request trigger, so listing their prefixes here
  # too would only run every branch twice once its PR is open. `main` is the trunk and has
  # no PR of its own, so it needs the push trigger.
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Everything below only reads the repository: it builds, tests and uploads a build
# artifact. Nothing writes back, so the token is scoped to reads and any job that ever
# does need to write has to say so itself.
permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    # A Gradle step hung fetching the -SNAPSHOT would burn the 360-minute default; a cold
    # build takes about a minute.
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `gradle/wrapper/gradle-wrapper.jar` is an executable committed to the repository
      # and run by every job that calls ./gradlew, and no reviewer can read a diff of it.
      # This checksums it against Gradle's published releases, which is the accepted
      # answer - deleting the jar is not, the wrapper has to stay.
      #
      # Before anything that could execute it. Validating after the fact would prove only
      # that the jar which already ran was the right one.
      #
      # The check reaches services.gradle.org, and that call has no retry of its own. It
      # failed twice on 2026-08-25 with ENETUNREACH and ETIMEDOUT, on unrelated pull
      # requests in SpiralGenesis, and a re-run cleared it both times. Because the step
      # runs early, a transient failure costs the whole job. So it is attempted twice
      # before the job is allowed to fail.
      #
      # Pinning the expected checksum into this repository would remove the network call
      # rather than soften it, so the network call stays: the guarantee this check
      # provides is that the checksum comes from a source an attacker editing this
      # repository cannot also edit. A committed checksum can be changed in the same pull
      # request as the jar it describes.
      - name: Validate Gradle Wrapper
        id: wrapper
        continue-on-error: true
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # ETIMEDOUT arrives with its own delay built in, but ENETUNREACH returns instantly,
      # so retrying straight away would reach the same unreachable network microseconds
      # later and prove nothing. Give a brief outage time to clear.
      - name: Wait Before Revalidating
        if: steps.wrapper.outcome == 'failure'
        run: sleep 15

      # Only reached when the first attempt failed. This one is not tolerated: a wrapper
      # that fails validation twice fails the job.
      - name: Validate Gradle Wrapper (retry)
        if: steps.wrapper.outcome == 'failure'
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Defensive only. `gradlew` currently carries mode 100755 in the index, so this is a
      # no-op on every checkout of this repository as it stands. It is kept because the
      # bit can be lost by a future commit made from a filesystem that does not carry it,
      # and because the step is byte-identical to SpiralGenesis's and costs nothing.
      - name: Ensure Gradle Wrapper Is Executable
        run: chmod +x ./gradlew

      # There are no test sources yet, so this reports NO-SOURCE and passes trivially.
      # It is a separate step from the build anyway, so that once tests exist a red run
      # says "tests" rather than "gradle".
      - name: Run Tests
        run: ./gradlew test --no-daemon

      # `build`, not `shadowJar`: it runs check plus the full assemble, so the sources
      # and javadoc jars the release pipeline will publish are compiled here rather than
      # first failing at tag time. `build` already dependsOn(shadowJar) in build.gradle.kts.
      - name: Build
        run: ./gradlew build --no-daemon

      # build/libs holds four jars: the shaded SessionPulse-<version>.jar, and the
      # -thin, -sources and -javadoc siblings. Only the shaded one is the plugin. The
      # exclusions are load-bearing: `jar` carries the `thin` classifier precisely so the
      # thin jar cannot occupy the plugin's path, and an unqualified *.jar glob would put
      # all four in one directory for a smoke job or a human to pick the wrong one out of.
      # The list is a denylist, so any new archive task added to the build has to extend
      # these exclusions or its jar joins the artifact silently.
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SessionPulse-SNAPSHOT
          path: |
            build/libs/*.jar
            !build/libs/*-thin.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
          if-no-files-found: error
          retention-days: 7

  # The scheduler issue's own Done-when, run in CI rather than asserted in a PR
  # description: does a jar carrying a relocated FoliaLib and a relocated Adventure
  # actually come up? The relocation is the highest-uncertainty decision in this
  # milestone, and every issue after it is written against the assumption that it holds.
  # Discovering otherwise at the smoke-matrix stage would be ten merges too late.
  #
  # Deliberately NOT added to main's required-check list in the pull request that
  # introduces it. N6-CI-03: read the names off a real run first, and note that a matrix
  # reports one context per leg.
  boot:
    name: Boot Test (${{ matrix.label }})
    needs: build
    runs-on: ubuntu-latest
    # A hung JVM is caught by the script's own BOOT_TIMEOUT, but a hung download is not.
    timeout-minutes: 25

    strategy:
      # Paper and Folia fail for different reasons, and seeing both results is the point.
      fail-fast: false
      matrix:
        # Spigot is absent and that is not an oversight. Spigot publishes no server jar -
        # BuildTools is the only route, it takes 10-25 minutes and 2GB, and its output may
        # not be redistributed or cached publicly. The Spigot boot is a manual gate before
        # merge, and whether it can become a CI leg at all is the smoke-test issue's
        # question.
        #
        # Two Minecraft versions rather than one, because adventure-platform-bukkit's
        # CraftBukkitFacet reflects into version-specific server internals: the 1.20.4 pair
        # alone would prove the relocation only against the version the plugin compiles
        # for. Both are real published Folia versions, checked against the v3 API - Folia
        # publishes 1.19.4, 1.20.1/.2/.4/.6, 1.21.4/.5/.6/.8/.11, 26.1.2 and 26.2, so
        # "1.21" and "26.1" are API bucket keys rather than versions and cannot be used
        # here.
        #
        # No 26.x leg in this issue. Minecraft 26.1 and newer refuse to boot below Java
        # 25, and adventure-platform-bukkit 4.4.1 predates them - it is expected to fall
        # back to a legacy facet there rather than fail, which degrades MiniMessage output
        # rather than breaking the boot. That is a real limitation of the four-platform
        # claim on the newest servers, it needs measuring rather than guessing, and it
        # belongs to the compatibility issues.
        include:
          - label: 'paper 1.20.4'
            platform: paper
            minecraft: '1.20.4'
            java: '21'
          - label: 'folia 1.20.4'
            platform: folia
            minecraft: '1.20.4'
            java: '21'
          - label: 'paper 1.21.11'
            platform: paper
            minecraft: '1.21.11'
            java: '21'
          - label: 'folia 1.21.11'
            platform: folia
            minecraft: '1.21.11'
            java: '21'

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `java` here is the version the SERVER runs on, not the one the plugin is built
      # with. The jar stays Java 21 bytecode, which a newer runtime accepts.
      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      # The jar the build job already produced, rather than a second build. This is the
      # artifact a release would ship, so it is the one that has to boot.
      - name: Download Plugin Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: SessionPulse-SNAPSHOT
          path: dist

      - name: Boot Server and Verify Plugin Loads
        run: |
          chmod +x .github/scripts/boot-test.sh
          # The upload step's denylist already excludes the thin, sources and javadoc
          # jars, so this yields exactly one file. The exclusions are repeated anyway: a
          # future archive task that slipped past the denylist would otherwise be booted
          # here at random.
          JAR="$(find dist -name 'SessionPulse*.jar' ! -name '*-thin.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -1)"
          # find exits 0 on no match, so without this an artifact that failed to download
          # would invoke the script with an empty third argument and fail with a message
          # about the wrong thing.
          if [ -z "$JAR" ]; then
            echo "::error::No plugin jar was downloaded from the build job's artifact."
            exit 1
          fi
          echo "Booting with $JAR"
          .github/scripts/boot-test.sh "${{ matrix.platform }}" "${{ matrix.minecraft }}" "$JAR"

      # if: always(), because the log is most wanted on the runs that failed.
      - name: Upload Server Log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boot-log-${{ matrix.platform }}-${{ matrix.minecraft }}
          path: run-${{ matrix.platform }}/server.log
          retention-days: 7
          if-no-files-found: warn
