# Actions are pinned to commit SHAs, not tags, so nothing updates them on its own. That
# is the trade the pinning makes: a tag cannot be repointed under us, but a pin goes
# stale in silence. This is the other half of it.
#
# There is a build here now, so the Gradle ecosystem is declared alongside the actions
# one. N6-CI-06's normative text makes Dependabot the other half of SHA pinning, and the
# first Gradle dependencies arrive in the same change that adds this block.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Grouped, and that is the load-bearing part. Ungrouped, Dependabot opens one pull
    # request per action, and the first batch on 2026-08-20 showed what that costs:
    # `upload-artifact` was proposed for 7.0.1 while `download-artifact` stayed on 4.3.0,
    # held back behind the pull-request cap. Those two majors have to match - ci.yml
    # uploads in `build` and downloads in `smoke` - and `gradle/actions/setup-gradle` and
    # `.../wrapper-validation` are the same repository and want the same commit.
    #
    # A per-action pull request also goes GREEN on that split, because its own run both
    # uploads and downloads at the version under test. The incompatibility only appears
    # once it merges alongside the stale pin. Grouping removes the failure rather than
    # relying on CI to catch it.
    #
    # Majors are separated so a v4 -> v7 jump, which needs its release notes read, never
    # rides along with routine patches.
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      actions-major:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - major
    commit-message:
      # Conventional Commits, per CONTRIBUTING.md 3.5. Dependabot signs off its own
      # commits - `Signed-off-by: dependabot[bot] <support@github.com>` - so its pull
      # requests pass the DCO check unaided. Verified against seven of them, 2026-08-20.
      prefix: ci
    labels:
      - dependencies
    # One pull request per group, so this is a backstop rather than a limit that
    # shapes anything. It is what split the first batch when updates were ungrouped.
    open-pull-requests-limit: 5

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Majors are split from minors and patches for the same reason the actions groups
    # are, and this repository has already paid for it: com.gradleup.shadow 9.x requires
    # Gradle 9, and the wrapper is a manual bump this file does not cover (see the note
    # at the end of this block). While the wrapper sat at 8.10.2 an unsegregated group
    # would have proposed a shadow bump that could not build at all. The wrapper is on
    # 9.7.1 now and that particular pairing is resolved, but the shape recurs: a Gradle
    # major always lands here before the wrapper that supports it does.
    groups:
      gradle:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      gradle-major:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - major
    ignore:
      # The compile target is a compatibility decision, not a security one: the
      # spigot-api version decides the OLDEST server this plugin runs on, so a bot
      # raising it narrows the supported range silently. Changed by hand, with the
      # api-version in plugin.yml changed in the same commit.
      - dependency-name: org.spigotmc:spigot-api
      # Adventure follows adventure-platform-bukkit, not the newest adventure-api, and a
      # bot cannot know that. Every message this plugin sends goes through
      # BukkitAudiences, which ships in the adventure-platform line - and that line stops
      # at 4.4.1, which pins adventure-platform-api 4.4.1 and is built against
      # adventure-api 4.x. There is no adventure-platform 5.x at all, so there is no
      # combination in which adventure-api 5.x and BukkitAudiences both work.
      #
      # This is ignored rather than closed once because the failure is quiet and
      # expensive. Raising adventure-api alone still COMPILES and still ENABLES: the
      # plugin boots, picks its scheduler and shuts down cleanly, and only the
      # MiniMessage round trip is dead. `Build and Test` goes green on it. Pull request
      # 39 was exactly this, caught by the boot legs and nothing else.
      #
      # Lift this the day an adventure-platform 5.x is published, and bump both literals
      # in build.gradle.kts in the same commit.
      - dependency-name: net.kyori:adventure-api
        update-types: ["version-update:semver-major"]
      - dependency-name: net.kyori:adventure-text-minimessage
        update-types: ["version-update:semver-major"]
    commit-message:
      # `build` rather than `ci`: ci is the Conventional Commits type for workflow
      # actions, build is the one for build-system dependencies.
      prefix: build
    labels:
      - dependencies
    # The Gradle wrapper version is not covered by package-ecosystem: gradle. It stays a
    # manual bump.
    open-pull-requests-limit: 5
